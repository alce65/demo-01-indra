name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Gracias por crear una issue. Un miembro del equipo revisará tu solicitud pronto."
        pr-message: "Gracias por crear un pull request. Un miembro del equipo revisará tu solicitud pronto."
